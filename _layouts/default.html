<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{% if page.excerpt and page.excerpt != empty %}
<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
{% else %}
<meta name="description" content="{{ site.description | strip_newlines }}">
{% endif %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #1a1a1a;
  --white: #fafafa;
  --orange: #8A59F0;
  --line: #e3e3e0;
  --muted: #6b6b68;
  --red: #E1221C;
  --green: #0C7F4F;
  --purple: #8A59F0;
  --blue: #417DF2;
  --yellow: #FAF505;
  --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--white);
  color: var(--black);
  font-family: var(--sans);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 46rem;
  margin: 0 auto;
  padding: 0 24px 96px;
}
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-block: 28px;
  border-bottom: 1px solid var(--line);
}
nav a { color: var(--black); text-decoration: none; }
nav .brand {
  font-weight: 600;
  letter-spacing: -.01em;
}
nav .brand span { color: var(--orange); }
nav .links { display: flex; gap: 24px; flex-wrap: wrap; font-size: .9rem; }
nav .links a { color: var(--muted); transition: color .15s ease; }
nav .links a:hover { color: var(--black); }
header { padding-block: 64px 56px; }
.eyebrow {
  font-family: var(--mono);
  font-size: .8rem;
  letter-spacing: .02em;
  color: var(--orange);
  font-weight: 500;
}
h1 {
  margin: 16px 0 0;
  font-size: clamp(2.2rem, 6vw, 3.4rem);
  line-height: 1.08;
  letter-spacing: -.02em;
  font-weight: 600;
}
.lede {
  margin: 20px 0 0;
  max-width: 42ch;
  font-size: 1.1rem;
  color: var(--muted);
}
.cta { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  font-family: var(--sans);
  font-size: .9rem;
  font-weight: 500;
  text-decoration: none;
  padding: 11px 20px;
  border-radius: 6px;
  border: 1px solid var(--black);
  color: var(--black);
  background: transparent;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.btn:hover { background: var(--black); color: var(--white); }
.btn.solid {
  background: var(--orange);
  border-color: var(--orange);
  color: var(--white);
}
.btn.solid:hover { background: #7440d6; border-color: #7440d6; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  border-top: 1px solid var(--line);
  padding-top: 20px;
  margin-bottom: 24px;
}
.section-head h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: .8rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.section-head a {
  font-family: var(--mono);
  font-size: .8rem;
  color: var(--orange);
  text-decoration: none;
}
.posts { display: grid; gap: 0; }
.post {
  --accent: var(--orange);
  display: block;
  text-decoration: none;
  color: inherit;
  border-bottom: 1px solid var(--line);
  border-left: 3px solid transparent;
  padding: 22px 0 22px 16px;
  transition: opacity .15s ease, border-left-color .15s ease;
}
.post:hover { opacity: .68; border-left-color: var(--accent); }
.posts .post:first-child { padding-top: 0; }
.post:nth-child(5n+1) { --accent: var(--red); }
.post:nth-child(5n+2) { --accent: var(--green); }
.post:nth-child(5n+3) { --accent: var(--purple); }
.post:nth-child(5n+4) { --accent: var(--blue); }
.post:nth-child(5n+5) { --accent: #b3ae00; }
.post .meta {
  font-family: var(--mono);
  font-size: .78rem;
  color: var(--muted);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.post .meta b { color: var(--accent); font-weight: 500; }
.post h3 {
  margin: 8px 0 0;
  font-size: 1.2rem;
  letter-spacing: -.01em;
  font-weight: 600;
  line-height: 1.3;
}
.post p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; max-width: 62ch; }
.empty {
  border: 1px dashed var(--line);
  border-radius: 6px;
  padding: 28px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: .85rem;
}
.entry-header { padding-block: 48px 32px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.back-link { font-family: var(--mono); font-size: .8rem; color: var(--orange); text-decoration: none; }
.entry-meta {
  font-family: var(--mono);
  font-size: .78rem;
  color: var(--muted);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.entry-meta b { color: var(--orange); font-weight: 500; }
.entry-title {
  margin: 12px 0 0;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  line-height: 1.15;
  letter-spacing: -.02em;
  font-weight: 600;
}
.entry-content { padding-bottom: 48px; }
.entry-content p { margin: 0 0 20px; color: var(--black); }
.entry-content a { color: var(--orange); }
.entry-content h2, .entry-content h3 { margin: 40px 0 16px; font-weight: 600; letter-spacing: -.01em; }
.entry-content ul, .entry-content ol { margin: 0 0 20px; padding-left: 1.4em; }
.entry-content li { margin-bottom: 8px; }
.entry-content code { font-family: var(--mono); font-size: .9em; background: var(--line); padding: 2px 6px; border-radius: 4px; }
.entry-content pre { background: var(--black); color: var(--white); padding: 16px; border-radius: 6px; overflow-x: auto; }
.entry-content pre code { background: none; padding: 0; }
.entry-content blockquote { margin: 0 0 20px; padding-left: 16px; border-left: 3px solid var(--orange); color: var(--muted); }
.entry-content img { max-width: 100%; border-radius: 6px; }
footer {
  margin-top: 56px;
  border-top: 1px solid var(--line);
  padding-top: 24px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: .78rem;
  color: var(--muted);
}
footer a { color: var(--muted); text-decoration: none; }
footer a:hover { color: var(--black); }
.chips { margin-top: 56px; display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .02em;
  padding: 7px 12px;
  border-radius: 999px;
  color: var(--white);
  font-weight: 500;
}
.chip.c1 { background: var(--red); }
.chip.c2 { background: var(--green); }
.chip.c3 { background: var(--purple); }
.chip.c4 { background: var(--blue); }
.chip.c5 { background: var(--yellow); color: var(--black); }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}<span>.</span></a>
    <div class="links">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
    </div>
  </nav>

  {{ content }}

  <footer>
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</span>
    <a href="https://github.com/{{ site.github_username }}">github.com/{{ site.github_username }}</a>
  </footer>
</div>
</body>
</html>
